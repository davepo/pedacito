name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One job per other supported OS keeps the platform branches honest
        # without tripling the whole Python matrix.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + fake-server end-to-end tests
        run: pytest -q

  wheel-smoke:
    # Editable installs import README/QUICKSTART/docs from the checkout, so
    # they cannot catch files left out of the wheel. Build and install the
    # real wheel once, then prove the installed package has the guides and
    # that `pdc how`/the docs corpus can use them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the wheel into an isolated target
        run: |
          TARGET="$RUNNER_TEMP/pdc-wheel"
          rm -rf "$TARGET"
          python -m pip install --target "$TARGET" dist/*.whl
          for name in README.md QUICKSTART.md MODEL_GUIDE.md; do
            test -f "$TARGET/share/pedacito/$name"
          done
          for name in ARCHITECTURE CONFIG INSTALLATION SECURITY USAGE; do
            test -f "$TARGET/share/pedacito/docs/$name.md"
          done
      - name: Smoke-test `pdc how` and the installed docs corpus
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/pdc-wheel
        run: |
          "$RUNNER_TEMP/pdc-wheel/bin/pdc" how --offline \
            "how does auto-tune behave when no telemetry is available?" \
            > how-answer.txt
          grep -q "auto-tune abstain" how-answer.txt
          python - <<'PY'
          from pathlib import Path

          from pedacito import config, how

          root = Path(how.find_docs_root()).resolve()
          expected = (Path.cwd() / "pdc-wheel" / "share" / "pedacito").resolve()
          assert root == expected, (root, expected)

          chunks = how.build_corpus()
          files = {chunk.file for chunk in chunks}
          for name in (
              "README.md", "QUICKSTART.md", "MODEL_GUIDE.md",
              "docs/ARCHITECTURE.md", "docs/CONFIG.md",
              "docs/INSTALLATION.md", "docs/SECURITY.md", "docs/USAGE.md",
          ):
              assert name in files, (name, sorted(files))

          # 'installs the full core' exists only in docs/INSTALLATION.md, so
          # this proves the packaged prose reaches the retriever.
          text, picked = how.select_references(
              "how do I install pedacito on a GPU server?",
              chunks, config.Config())
          assert any(c.file == "docs/INSTALLATION.md" for c in picked), picked
          assert "installs the full core" in text
          assert "pipx install pedacito" in text
          print("installed docs corpus OK")
          PY
