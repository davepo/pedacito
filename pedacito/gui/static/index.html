<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pedacito</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body data-view="chat">

<header id="topbar">
  <div class="brand">pe<span>da</span>cito</div>
  <div id="projectBar">
    <input type="text" id="path" placeholder="/path/to/your/project" spellcheck="false" autocomplete="off">
    <button id="browseBtn" title="browse folders on this machine">Browse&hellip;</button>
    <select id="recent" title="recent projects"></select>
    <select id="profile" title="model profile"></select>
    <button class="primary" id="openBtn">Open</button>
  </div>
  <div id="topRight">
    <span class="chip" id="modelChip" title="click to check the model server"><i class="dot" id="modelDot"></i><b id="modelLbl">no project</b></span>
    <span class="chip" id="usageChip" hidden></span>
    <button id="projMenuBtn" title="index, restore and other project actions">Project &#9662;</button>
    <button id="settingsBtn" title="profiles and settings">&#9881; Settings</button>
    <select id="theme" title="color scheme">
      <option value="parchment">Parchment</option>
      <option value="sage">Sage</option>
      <option value="mocha">Mocha</option>
      <option value="clay">Clay</option>
      <option value="nightshade">Nightshade</option>
    </select>
    <button class="danger" id="exitBtn" title="stop the pedacito gui server">Exit</button>
  </div>
</header>

<main id="app">
  <section class="panel" id="chatPanel">
    <div class="panel-head">
      <h2>Chat</h2>
      <span class="muted small-text grow" id="busyLbl"></span>
      <button class="ghost small" id="clearChat" title="clear the conversation">Clear</button>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <div id="modeTabs"></div>
      <p id="modeHint"></p>
      <div id="attachRow"></div>
      <textarea id="input" rows="3" spellcheck="true"></textarea>
      <div id="optsBox" hidden></div>
      <div id="composerBtns">
        <button id="attachBtn" title="attach a text file (or drop one here)">&#128206; Attach</button>
        <button id="optsBtn" class="ghost">Options &#9662;</button>
        <span class="grow muted small-text" id="sendHint"></span>
        <button class="primary" id="sendBtn">Send</button>
      </div>
      <input type="file" id="filePick" multiple hidden>
    </div>
  </section>

  <div class="splitter" id="split1" title="drag to resize"></div>

  <section id="workPanel">
    <div class="panel" id="codePanel">
      <div class="panel-head">
        <div class="tabs" id="codeTabs">
          <button data-tab="changes" class="on">Changes<span class="badge" id="chgBadge" hidden></span></button>
          <button data-tab="plan">Plan<span class="badge" id="planBadge" hidden></span></button>
          <button data-tab="file">File</button>
        </div>
      </div>
      <div class="tabpane" id="tab-changes">
        <div id="reviewBar" hidden>
          <span id="reviewTitle"></span><span class="badge-out" id="reviewOutcome" hidden></span>
          <div id="reviewActions">
            <button class="small" id="editBtn" title="edit the updated code by hand before accepting">&#9998; Edit updated</button>
            <button class="small danger" id="rejectBtn">Reject all</button>
            <button class="small primary" id="acceptBtn">Accept</button>
          </div>
        </div>
        <div id="fileStrip" hidden></div>
        <div id="panes" hidden>
          <div class="pane"><div class="pane-head"><span>Old code</span><span id="oldInfo"></span></div><div class="code" id="oldCode"></div></div>
          <div class="pane"><div class="pane-head"><span>Updated code</span><span id="newInfo"></span></div><div class="code" id="newCode"></div><textarea id="editBox" hidden spellcheck="false"></textarea></div>
        </div>
        <div class="placeholder" id="noReview"><b>No proposed changes yet.</b><br>Run a <b>Task</b> in <i>Review</i> mode: the model's edits appear here, old code beside updated code, for you to accept or reject.</div>
      </div>
      <div class="tabpane" id="tab-plan" hidden>
        <div id="planBar" class="row" style="padding:6px 10px;border-bottom:1px solid var(--line)">
          <span class="mono small-text grow" id="planPath"></span>
          <button class="small" id="planEditBtn">Edit</button>
          <button class="small" id="planSaveBtn" hidden>Save</button>
          <button class="small primary" id="planRunBtn" hidden>Run this plan</button>
        </div>
        <div id="planBody"></div>
        <textarea id="planEdit" hidden spellcheck="false"></textarea>
      </div>
      <div class="tabpane" id="tab-file" hidden>
        <div id="filePath" class="muted">Pick a file from the list on the right.</div>
        <div id="fileView"><div class="code" id="fileCode"></div></div>
      </div>
    </div>
    <div class="splitter h" id="split2" title="drag to resize"></div>
    <div class="panel" id="termPanel">
      <div class="panel-head">
        <h2>Terminal</h2><span class="muted small-text grow">live output of whatever pedacito is doing</span>
        <label class="chk"><input type="checkbox" id="termFollow" checked> follow</label>
        <button class="ghost small" id="termClear">Clear</button>
        <button class="ghost small" id="termToggle" title="collapse / expand">&#9660;</button>
      </div>
      <div id="term"></div>
    </div>
  </section>

  <div class="splitter" id="split3" title="drag to resize"></div>

  <aside class="panel" id="filesPanel">
    <div class="panel-head"><h2>Files</h2><span class="grow"></span><button class="ghost small" id="hideFiles" title="hide this panel">&times;</button></div>
    <div class="tools"><input type="text" id="fileFilter" placeholder="filter&hellip;" autocomplete="off"></div>
    <div id="fileCount">&mdash;</div>
    <div id="tree"></div>
  </aside>
</main>

<nav id="mobileTabs">
  <button data-view="chat" class="on">Chat</button>
  <button data-view="work">Changes</button>
  <button data-view="files">Files</button>
</nav>

<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/panels.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
