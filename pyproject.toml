[project]
name = "pedacito-local"
version = "0.1.0"
description = "Index-and-lookup intermediary for coding with a local LLM"
requires-python = ">=3.11"   # tomllib
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # HTTP client for every model server and hosted API.
    "requests>=2.31",
    # AST chunking and the exact syntax gate for edits. 0.26.0 regressed Node
    # lifetime handling and segfaults CPython 3.12/3.14 (py-tree-sitter#472).
    # 0.25.2 is the last known-good release and ships cp314 wheels; keep the
    # ceiling until upstream ships a fixed release.
    "tree-sitter>=0.23,<0.26",
    # Grammars for JS/TS, Go, Rust, Java, C/C++, C#, Ruby, and more, loaded
    # through get_parser() in pedacito/chunker_ts.py.
    "tree-sitter-language-pack>=1.0",
    # Runs the holdout rubric and the generated projects' tests (`pytest -q`
    # in pedacito/benchmarks.py and the verify/repair loop).
    "pytest>=8",
    # The `ruff check` linter used by `pedacito diagnose`, post-edit checks,
    # and the auto loop's --diagnostics.
    "ruff>=0.5",
]

[project.scripts]
pedacito = "pedacito.cli:main"
pdc = "pedacito.cli:main"

# pytest and ruff are core dependencies now. `dev` remains so existing
# `pip install -e ".[dev]"` commands (including CI) keep working.
[project.optional-dependencies]
dev = ["pytest>=8"]
# Screenshot capture/pixel analysis for the opt-in `screenshot` action.
vision = ["Pillow>=10"]
# Headless browser automation for the opt-in `browser` action. After
# installing, run `python -m playwright install chromium` for the browser.
browser = ["playwright>=1.40"]
# Every optional feature in one step: vision + browser.
full = ["Pillow>=10", "playwright>=1.40"]

[tool.pytest.ini_options]
markers = ["network: tests that spawn the fake LLM server (fast, local)"]
# Some environments ship a broken third-party pytest plugin (e.g. libtmux
# versions whose own fixture carries a mark, which pytest >=8.4 rejects at
# import time -- collection dies before any test runs). Disabling autoload
# keeps `pytest` working everywhere; add plugins back with -p <name>.
addopts = "-p no:cacheprovider --disable-plugin-autoload"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The project's historical lint contract (pycodestyle errors + pyflakes).
# Recent ruff releases expanded their default rule set dramatically; pinning
# it here keeps `ruff check pedacito/ tests/` reproducible across versions.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # tests insert the checkout root on sys.path before importing
    "E501",  # long harness message and prompt lines are deliberate
    "E701", "E702",  # compact test setup uses statement separators
    "E731",  # lambda factories in tests
    "E741",  # historical short names (l, O) in test helpers
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pedacito", "pedacito.gui"]

# The browser GUI's page, stylesheet and scripts are served from the package.
[tool.setuptools.package-data]
"pedacito.gui" = ["static/*"]

# `pedacito how` reads these two files at runtime. Keep them in a normal
# (non-editable) install as well as in a checkout.
[tool.setuptools.data-files]
"share/pedacito" = ["README.md", "QUICKSTART.md", "MODEL_GUIDE.md"]
